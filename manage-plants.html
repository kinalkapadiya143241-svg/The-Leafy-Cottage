<div class="manage-plants">

    <h1></h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Plant Name</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rose</td>
            <td>₹150</td>
        </tr>

        <tr>

            <td>₹220</td>
        </tr>

    </table>

<div class="container">

    <h1>Manage Plants</h1>

    <form onsubmit="return validatePlant()">

        <label>Plant Name</label>
        <input type="text" id="plantName"
               placeholder="Enter plant name">

        <label>Plant Price</label>
        <input type="number" id="plantPrice"
               placeholder="Enter price">

        <label>Plant Stock</label>
        <input type="number" id="plantStock"
               placeholder="Enter stock">

        <button class="btn" type="submit">Add Plant</button>

    </form>

</div>

<script src="validation.js"></script>
